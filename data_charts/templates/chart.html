{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'data_charts/css/charts.css' %}">
{% endblock %}

{% block content %}

    <h1>Select Data to Display</h1>
    <select id="dataSelector">
        <option value="nutrition">Nutrition Data</option>
        <option value="weight">Weight Data</option>
        <option value="exercise">Lift Progress</option>
    </select>
    <select id="exerciseSelection" style="display:none;">
        {% for lift in lifts %}
            <option value="{{ lift.id }}">
                {{ lift.name }}
            </option>

        {% endfor %}
    </select>
    <h2>Select time period</h2>
        <p id="warning" style="color: red; display:none;"></p>
        <label>
            From:
            <input type="date" id="date_from">
        </label>
        <label>
            To:
            <input type="date" id="date_to">
        </label>
    <br>

    <div id="canvas-container" style="padding: 20px;">
        <canvas id="statisticsDataChart" ></canvas>
    </div>

    <div id="tooltip"></div>

    <script type="module" src="{% static 'js/statistics_chart_controller.js' %}"></script>

{% endblock %}
