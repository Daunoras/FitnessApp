{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
    <div class="content-section">
    <form method="POST">
        {% csrf_token %}
        <fieldset class="form-group">
            <h1>Delete</h1>
            <h2>Do you really want to delete {{ object.name }}?</h2>
        </fieldset>
        <div class="form-group">
            <button id="destroy" type="submit">Confirm</button>

        </div>
    </form>
        <a href="{% url 'exercise-update' object.id %}"><button>Cancel</button></a>
    </div>
{% endblock content %}
